[project]
name = "crecimiento-empresas-colombianas"
version = "0.1.0"
description = "ñ"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
]

# PyTorch con CUDA 13.0 en Windows/Linux (funciona también sin GPU NVIDIA, solo pesa más)
# y la versión CPU en macOS, donde no hay CUDA.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
